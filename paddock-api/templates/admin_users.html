<h2>用户管理（{{ users.len() }}）</h2>
<table>
<tr><th>#</th><th>用户名</th><th>member_openid</th><th>最好成绩数</th><th>注册日</th></tr>
{% for u in users %}
<tr>
  <td>{{ u.reg_seq }}</td>
  <td>{{ u.username }}</td>
  <td class="code">{% if u.member_openid.is_empty() %}<i style="color:#777">未绑定</i>{% else %}{{ u.member_openid }}{% endif %}</td>
  <td>{{ u.best_count }}</td>
  <td>{{ u.created }}</td>
</tr>
{% endfor %}
</table>
