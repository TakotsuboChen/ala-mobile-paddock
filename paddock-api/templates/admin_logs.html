<h2>日志</h2>
<div class="logtabs">
  <button class="logtab{% if tab != "evt" %} active{% endif %}" id="tab-run" onclick="switchTab('run')">运行日志</button>
  <button class="logtab{% if tab == "evt" %} active{% endif %}" id="tab-evt" onclick="switchTab('evt')">业务事件</button>
</div>

<!-- ===== 运行日志视图：终端风，游标增量轮询 ===== -->
<div id="view-run" {% if tab == "evt" %}style="display:none"{% endif %}>
  <div class="runbar">
    <span class="rundot" id="run-dot"></span>
    <span id="run-status">加载中…</span>
    <span style="flex:1"></span>
    <label style="display:flex;align-items:center;gap:.3rem;cursor:pointer">
      <input type="checkbox" id="run-follow" checked>自动滚动
    </label>
    <button class="btn" onclick="runClearView()">清屏</button>
  </div>
  <pre id="runterm" class="runterm"></pre>
</div>

<!-- ===== 业务事件视图：原表格 ===== -->
<div id="view-evt" {% if tab != "evt" %}style="display:none"{% endif %}>
<form method="get" action="/admin/logs" style="margin-bottom:.8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
  <input type="hidden" name="tab" value="evt">
  <select name="level" style="padding:.4rem;border-radius:6px;border:1px solid #444;background:#2a2a2c;color:#eee">
    <option value="">全部级别</option>
    <option value="info" {% if level == "info" %}selected{% endif %}>info</option>
    <option value="warn" {% if level == "warn" %}selected{% endif %}>warn</option>
    <option value="error" {% if level == "error" %}selected{% endif %}>error</option>
  </select>
  <select name="cat" style="padding:.4rem;border-radius:6px;border:1px solid #444;background:#2a2a2c;color:#eee">
    <option value="">全部分类</option>
    <option value="admin" {% if cat == "admin" %}selected{% endif %}>管理端</option>
    <option value="auth" {% if cat == "auth" %}selected{% endif %}>认证</option>
    <option value="lap" {% if cat == "lap" %}selected{% endif %}>成绩</option>
    <option value="bot" {% if cat == "bot" %}selected{% endif %}>Bot</option>
  </select>
  <input name="q" value="{{ q }}" placeholder="搜索消息/操作者" style="padding:.4rem;border-radius:6px;border:1px solid #444;background:#2a2a2c;color:#eee">
  <button class="btn">筛选</button>
</form>
<table id="log-table">
<tr><th>时间</th><th>级别</th><th>分类</th><th>操作者</th><th>事件</th><th>消息</th></tr>
{% for l in rows %}
<tr>
  <td class="code">{{ l.created }}</td>
  <td><span class="lvl lvl-{{ l.level }}">{{ l.level }}</span></td>
  <td>{{ l.cat_display }}</td>
  <td>{{ l.actor }}</td>
  <td class="code">{{ l.event }}</td>
  <td style="white-space:normal">{{ l.message }}</td>
</tr>
{% endfor %}
{% if rows.is_empty() %}<tr><td colspan="6" style="color:#777;white-space:normal">无日志（当前筛选条件下）</td></tr>{% endif %}
</table>
<div class="pager" id="log-pager"></div>
</div>

<script>
// ---- Tab 切换（切 tab 同步 URL，刷新/分享后仍停在本 tab） ----
function switchTab(t){
  document.getElementById('view-run').style.display = t==='run' ? '' : 'none';
  document.getElementById('view-evt').style.display = t==='evt' ? '' : 'none';
  document.getElementById('tab-run').classList.toggle('active', t==='run');
  document.getElementById('tab-evt').classList.toggle('active', t==='evt');
  const url = new URL(location.href);
  if(t==='evt'){ url.searchParams.set('tab','evt'); P.tab = 'evt'; }
  else { url.searchParams.delete('tab'); P.tab = ''; }
  history.replaceState(null, '', url);
  if(t==='run') runStart();
}
// ---- 运行日志：游标增量轮询（2s）+ 级别着色 + 自动滚底 ----
const P = { page: {{ page }}, pages: {{ pages }}, size: {{ size }}, q: {{ q_json | safe }}, level: "{{ level }}", cat: "{{ cat }}", tab: "{{ tab }}" };
let runTimer = null, runLast = 0, runStarted = false;
const MAX_VIEW_LINES = 3000; // 视图上限：DOM 行数超出丢头（防长开页面内存膨胀）

function runStart(){
  if(runStarted) return;
  runStarted = true;
  runPoll();
  runTimer = setInterval(runPoll, 2000);
}
function runPoll(){
  fetch(`/admin/api/runtime-logs?after=${runLast}`)
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok){ setStatus('会话过期', false); return; }
      const term = document.getElementById('runterm');
      const atBottom = term.scrollHeight - term.scrollTop - term.clientHeight < 40;
      if(j.lines.length){
        // 多行 payload（如 payload 原文含换行）逐行入 <pre>，级别 token 着色
        const frag = document.createDocumentFragment();
        for(let i = 0; i < j.lines.length; i++){
          const line = j.lines[i];
          const div = document.createElement('div');
          // tracing fmt 级别 token：` INFO ` / ` WARN ` / `ERROR`（无方括号，按词匹配）
          div.className = (/\bERROR\b/.test(line) ? 'rl-err' : /\bWARN\b/.test(line) ? 'rl-warn' : '')
            + ((runLast + i + 1) % 2 ? '' : ' rl-even'); // 斑马纹：全局序号奇偶，跨批次也稳定交替
          div.textContent = line;
          frag.appendChild(div);
        }
        term.appendChild(frag);
        while(term.children.length > MAX_VIEW_LINES) term.removeChild(term.firstChild);
        runLast = j.last;
        if(document.getElementById('run-follow').checked && atBottom) term.scrollTop = term.scrollHeight;
        setStatus(`实时跟踪中 · 已显示 ${term.children.length} 行`, true);
      } else {
        setStatus('实时跟踪中 · 无新日志', true);
      }
    })
    .catch(()=>setStatus('网络错误，重试中…', false));
}
function setStatus(txt, ok){
  document.getElementById('run-status').textContent = txt;
  document.getElementById('run-dot').className = 'rundot' + (ok ? ' ok' : ' bad');
}
function runClearView(){
  document.getElementById('runterm').innerHTML = '';
  runLast = 0;
  runPoll();
}
// 游标重置为 0 时（清屏/首次），after=0 会从缓冲最旧开始——上面 runClearView 正确复用此语义

// ---- 业务事件视图：分页条（切到该 tab 才可见） ----
function goPage(p, s){
  const params = new URLSearchParams();
  params.set('tab', 'evt');
  if(P.q) params.set('q', P.q);
  if(P.level) params.set('level', P.level);
  if(P.cat) params.set('cat', P.cat);
  params.set('page', p);
  params.set('size', s);
  location.href = `/admin/logs?${params.toString()}`;
}
renderPager(document.getElementById('log-pager'), P.page, P.pages, P.size,
  (p,s)=>goPage(p,s), s=>goPage(1,s));
// 默认 tab 由服务端 tab 参数决定；轮询只在运行日志 tab 启动
if(P.tab !== 'evt') runStart();
</script>
