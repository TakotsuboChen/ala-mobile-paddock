# Garage 最小单节点配置（头像小对象存储；详见 https://garagehq.deuxfleurs.fr/）
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "placeholder-replace-with-32-byte-hex"

[s3_api]
s3_region = "paddock"
api_bind_addr = "[::]:3900"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".s3.paddock.invalid"

[admin]
api_bind_addr = "[::]:3903"